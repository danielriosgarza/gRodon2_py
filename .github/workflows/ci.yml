name: Test and build
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,genome]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=grodon --cov-report=term-missing
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps --find-links dist grodon2-py
      - run: grodon --version
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.1.4" "biopython==1.83" "pyrodigal==3.7.1" pytest
      - run: python -m pip install --no-deps .
      - run: pytest
  local-tools-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,genome]"
      - run: grodon setup --tools-dir .tools/blast-2.17.0
      - run: pytest tests/test_annotation.py tests/test_tools.py
        env:
          GRODON_TEST_BLASTP: ${{ github.workspace }}/.tools/blast-2.17.0/bin/blastp
